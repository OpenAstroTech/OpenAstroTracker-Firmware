name: PR Title Lint

on:
  pull_request:
    types:
      - opened
      - edited
      - reopened

jobs:
  pr-title-lint:
    name: PR Title (Conventional Commits)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
